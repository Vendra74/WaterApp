name: Manter Supabase ativo

# O plano gratuito do Supabase pausa projetos sem atividade por 7 dias.
# Esta rotina faz uma consulta leve à API REST (contada como atividade)
# três vezes por semana, usando só a chave pública (anon). Não chama a
# função de leitura por foto, que custa créditos de IA. Cada chamada tenta
# várias vezes: uma falha de rede do runner (ex.: DNS) não pode deixar o
# projeto 7 dias sem atividade.

on:
  schedule:
    - cron: '0 12 * * 1,3,5' # segunda, quarta e sexta às 12:00 UTC (9h em Brasília)
  workflow_dispatch:

jobs:
  ping:
    name: Consulta leve ao Supabase
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://vqpvazseakezfsivxtgq.supabase.co
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Conferir segredo
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Falta o segredo SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions). É a chave pública (anon) do projeto, a mesma do .env."
            exit 1
          fi

      - name: Conferir DNS do projeto
        run: |
          host="${SUPABASE_URL#https://}"
          echo "supabase.co -> $(getent hosts supabase.co | head -1 || echo 'NÃO RESOLVE')"
          if getent hosts "$host" >/dev/null; then
            echo "$host -> $(getent hosts "$host" | head -1)"
          else
            echo "::error::O endereço $host não existe no DNS. Se supabase.co resolve e o projeto não, o projeto foi PAUSADO ou apagado: confira em https://supabase.com/dashboard/project/vqpvazseakezfsivxtgq e reative."
            exit 1
          fi

      - name: Consultar tabela leituras_receita (limit 1)
        run: |
          # --retry-all-errors cobre DNS/conexão; 6 tentativas com 20 s entre elas (~2 min).
          code=$(curl -sS -m 30 --retry 5 --retry-delay 20 --retry-all-errors \
            -o /tmp/resp.txt -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/leituras_receita?select=id&limit=1") || code="falha-de-rede"
          echo "HTTP $code"
          # 200 (RLS devolve lista vazia) é o esperado; 401/403 indicam chave inválida;
          # 540 é a resposta do Supabase para projeto pausado.
          case "$code" in
            200|204) echo "Supabase respondeu: atividade registrada." ;;
            401|403) echo "::error::Chave recusada pelo Supabase (HTTP $code). Atualize o segredo SUPABASE_ANON_KEY."; head -c 500 /tmp/resp.txt; exit 1 ;;
            540) echo "::error::O projeto Supabase está PAUSADO. Reative em https://supabase.com/dashboard/project/vqpvazseakezfsivxtgq"; head -c 500 /tmp/resp.txt; exit 1 ;;
            falha-de-rede) echo "::error::Sem resposta do Supabase após 6 tentativas (rede/DNS do runner). Rode o workflow de novo pela aba Actions."; exit 1 ;;
            *) echo "::warning::Resposta inesperada (HTTP $code)."; head -c 500 /tmp/resp.txt ;;
          esac

      - name: Verificar saúde do Auth
        run: |
          curl -sS -f -m 30 --retry 5 --retry-delay 20 --retry-all-errors \
            -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/auth/v1/health"
          echo
